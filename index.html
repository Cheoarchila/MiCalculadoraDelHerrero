<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Calculadora del Herrero si funciona</title>
           <style>
        /* Alineación perfecta estilo tabla de control */
        #listaMarcas, #listaMarcas2 {
            font-family: monospace; /* Mantiene todos los caracteres del mismo ancho */
            font-size: 1.2rem;
            line-height: 1.8;
            margin-top: 10px;
        }

        /* Esto alinea las unidades, decenas y centenas a la derecha */
        #listaMarcas span, #listaMarcas2 span {
            display: inline-block;
            width: 60px;         /* Espacio suficiente para números de hasta 4 dígitos */
            text-align: right;   /* Empuja el número hacia la derecha */
            font-weight: bold;
            color: #1e293b;      /* Color oscuro profesional */
        }
    </style>


</head>

<body>

    <h1>Mi Calculadora del Herrero</h1>

    <h2>Acanalado a 90°</h2>

    <label for="anchoPlancha">Ancho de plancha:</label>
    <input type="number" id="anchoPlancha" value="1200" step="1" onkeydown="return event.key !== '.' && event.key !== ','" onblur="verificarMedidaPlancha()">
    <br><br>
    
    <label>Medida final:</label>
    <input type="number" id="medidaFinal" value="1000" step="1" onkeydown="return event.key !== '.' && event.key !== ','" onblur="verificarMedidaFinal()">
    <br><br>

    <label>Canales:</label>
    <input type="number" id="canales" value="3" step="1" onblur="verificarCanales()">
    <br><br>

    <label>Profundidad:</label>
    <input type="number" id="profundidad" value="15" onblur="verificarProfundidad()">
    <br><br>

    <label>Bordes:</label>
    <input type="number" id="bordes" value="20" onblur="verificarBordes()">
    <br><br>

    <label>Espesor:</label>
    <input type="number" id="espesor" value="1" onblur="verificarEspesor()">
    <br><br>

    <button onclick="calcular()">Calcular</button>

    <h3>Resultado</h3>

    <p>Ancho de canal: <span id="anchoCanal">-</span></p>
    <p>Alto de canal: <span id="altoCanal">-</span></p>
    <p>Desarrollo: <span id="desarrollo">-</span></p>

        <div id="marcas">
        <h3>Marcas</h3>
        <div id="listaMarcas"></div>
        <!-- AGREGA ESTA LÍNEA AQUÍ ABAJO -->
        <div id="listaMarcas2"></div>
    </div>


    <script src="js/calculos.js"></script>
</body>

</html>
